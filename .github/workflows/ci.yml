name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - uses: ramsey/composer-install@v3

      - run: vendor/bin/phpstan analyse

  phpcs:
    name: PHP CodeSniffer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - uses: ramsey/composer-install@v3

      - run: vendor/bin/phpcs

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: orm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Fail instead of skip when a database service is unreachable.
      ORM_TEST_REQUIRE_DATABASES: '1'
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orm_test
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: orm_test
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_pgsql, pdo_mysql
          coverage: pcov

      - uses: ramsey/composer-install@v3

      # With coverage on, a test that runs a class missing from its #[CoversClass]/#[UsesClass]
      # attributes is risky, and failOnRisky fails the run.
      - run: vendor/bin/phpunit --coverage-text --only-summary-for-coverage-text

      # Coverage of everything the tests execute, not only the classes each test targets.
      - run: vendor/bin/phpunit --disable-coverage-targeting --coverage-clover=clover.xml

      - name: Check line coverage
        run: |
          php -r '
            $metrics = simplexml_load_file("clover.xml")->project->metrics;
            $coverage = 100 * (int) $metrics["coveredstatements"] / (int) $metrics["statements"];
            printf("Line coverage: %.2f%%\n", $coverage);
            exit($coverage < 98 ? 1 : 0);
          '
